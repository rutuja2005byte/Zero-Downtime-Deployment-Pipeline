services:

  app-blue:
    build: .
    container_name: app-blue
    environment:
      APP_VERSION: v1
    ports:
      - "3001:3000"
    restart: unless-stopped

  app-green:
    build: .
    container_name: app-green
    environment:
      APP_VERSION: v1
    ports:
      - "3002:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped